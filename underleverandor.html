<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; connect-src https://*.supabase.co wss://*.supabase.co; img-src 'self' data: https://tile.openstreetmap.org https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Road Force – Underleverandørportal</title>
<style>
:root{--bg:#0b0d10;--card:#14171c;--card2:#1b2027;--line:#262b34;--text:#f5f5f2;--muted:#8c94a3;--blue:#255cff;--green:#2fcf7a;--red:#ff5d5d;--amber:#f5b83d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:14px 16px 60px;display:grid;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.logo{font-weight:800;letter-spacing:.04em;font-size:18px}.logo b{color:var(--blue)}.logo small{display:block;font-weight:500;letter-spacing:0;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;min-width:0}
h2,h3{margin:0}h2{font-size:20px}h3{font-size:16px}.muted{color:var(--muted);font-size:14px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
input,select{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit}
button{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}button:disabled{opacity:.5}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
nav{display:flex;gap:6px;flex-wrap:wrap}nav button{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:9px 14px}nav button[aria-current=page]{background:var(--blue);border-color:var(--blue);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.tile b{display:block;font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}td small{display:block;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:rgba(37,92,255,.16);color:#9db6ff;white-space:nowrap}.pill.good{background:rgba(47,207,122,.16);color:#7fe3ad}.pill.warn{background:rgba(245,184,61,.16);color:#f5cf7d}.pill.low{background:rgba(255,93,93,.16);color:#ff9a9a}
.err{color:var(--red)}.notice{border-left:3px solid var(--amber);padding-left:10px;color:var(--muted);font-size:14px}[hidden]{display:none!important}
.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.filters label{min-width:150px}
.login{max-width:420px;margin:40px auto 0;width:100%}code{background:var(--card2);padding:2px 6px;border-radius:6px;word-break:break-all}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.dcard{display:grid;gap:4px;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--text);font-weight:400;padding:12px 14px}.dcard:hover{border-color:var(--blue)}.dcard b{font-weight:700}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.kv{display:grid;gap:2px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kv b{font-weight:600;word-break:break-word}
a{color:#9db6ff}td small{display:block}
@media (max-width:700px){
  main{padding:10px 10px 50px}nav{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}nav button{flex:0 0 auto}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile b{font-size:18px}
  .tw{border:0;overflow:visible}table{min-width:0}thead{display:none}table,tbody,tr,td{display:block;width:100%}
  tr{background:var(--card2);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:6px 10px}
  td{border:0;padding:5px 0;text-align:right;overflow:hidden}td::before{content:attr(data-label);float:left;color:var(--muted);font-size:12px;text-align:left;max-width:45%;padding-right:8px}
  td[colspan]{text-align:left}td[colspan]::before{content:none}
  .filters label{min-width:0;flex:1 1 140px}
}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:0;overflow:hidden}.kpi{display:grid;gap:6px;padding:20px 22px}.kpi+.kpi{border-left:1px solid var(--line)}.kpi b{font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.lm{height:62vh;min-height:320px;border-radius:12px;border:1px solid var(--line);background:#e5e3df}
.lm .leaflet-tooltip{font:13px/1.35 system-ui}.lm-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--green);margin-right:6px}.lm-dot.off{background:var(--muted)}
@media (max-width:700px){.lm{height:55vh}.kpi{padding:14px 12px}.kpi b{font-size:19px}.kpi span{font-size:12px}}
.lm-big{height:70vh;min-height:420px}@media (max-width:700px){.lm-big{height:62vh;min-height:360px}}
</style>
</head>
<body>
<main>
  <div class="top"><div class="logo">ROAD <b>FORCE</b><small id="firm">Underleverandørportal</small></div><button class="ghost" id="out" hidden>Log ud</button></div>
  <nav id="nav" hidden aria-label="Portal">
    <button data-v="overview">Overblik</button><button data-v="drivers">Chauffører</button><button data-v="trips">Ture</button>
    <button data-v="earnings">Indtjening</button><button data-v="settlements">Afregninger</button><button data-v="firm">Firmaoplysninger</button><button data-v="routes">Ruter <small>(kommer snart)</small></button>
  </nav>
  <div id="app" aria-live="polite"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="underleverandor.js?v=20261116-5"></script>
</body>
</html>
