<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Følg din levering · RoadForce</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0b0d10;--card:#14171c;--line:#262b34;--text:#f5f5f2;--muted:#8c94a3;--blue:#255cff;--green:#2fcf7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:grid;gap:12px}
.logo{font-weight:800;letter-spacing:.04em}.logo b{color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
h1{margin:0;font-size:22px}.muted{color:var(--muted);font-size:14px}
.steps{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}.steps li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.steps i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}.steps li.on{color:var(--text)}.steps li.on i{background:var(--green);border-color:var(--green)}
#map{height:280px;border-radius:14px;border:1px solid var(--line)}
.pill{display:inline-block;background:rgba(37,92,255,.16);color:#9db6ff;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
</style>
</head>
<body>
<main>
  <div class="logo">ROAD<b>FORCE</b></div>
  <div id="out" class="card"><p class="muted">Henter din leveringsstatus…</p></div>
  <div id="mapcard" class="card" hidden><div id="map"></div><p id="mapnote" class="muted"></p></div>
  <p class="muted">Dette link er personligt. Del det kun med dem, der skal følge leveringen. Chaufførens placering vises kun, mens godset er undervejs, og forsvinder, når leveringen er gennemført.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
  const CFG = window.RF_CONFIG || {}; const tok = new URLSearchParams(location.search).get('t');
  const out = document.getElementById('out');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const LABEL = { new: 'Bekræftet', assigned: 'Chauffør tildelt', loaded: 'Afhentet', in_transit: 'På vej', delivered: 'Leveret', cancelled: 'Annulleret' };
  const STEPS = ['new', 'assigned', 'loaded', 'in_transit', 'delivered'];
  const t = (iso) => new Date(iso).toLocaleString('da-DK', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  let map, marker, timer;
  async function load() {
    if (!tok) { out.innerHTML = '<h1>Linket er ugyldigt</h1>'; return; }
    let d = null;
    try {
      const r = await fetch(`${CFG.SUPABASE_URL}/rest/v1/rpc/get_tracking`, { method: 'POST', headers: { apikey: CFG.SUPABASE_ANON_KEY, Authorization: `Bearer ${CFG.SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: tok }) });
      d = await r.json();
    } catch (e) { out.innerHTML = '<h1>Kunne ikke hente status</h1><p class="muted">Tjek din forbindelse. Siden prøver igen automatisk.</p>'; return; }
    if (!d || d.message) { out.innerHTML = '<h1>Vi kan ikke finde leveringen</h1><p class="muted">Linket er ugyldigt eller udløbet.</p>'; return; }
    if (d.expired) { out.innerHTML = `<h1>${esc(d.ref)}</h1><p class="muted">Sporingen er udløbet.</p>`; stop(); return; }
    const reached = STEPS.indexOf(d.status); const at = {}; (d.events || []).forEach((e) => { at[e.status] = e.at; });
    out.innerHTML = `<span class="pill">${esc(LABEL[d.status] || d.status)}</span><h1>${esc(d.ref)}</h1>
      <p class="muted">${esc(d.from_city || '')}${d.to_city ? ' → ' + esc(d.to_city) : ''}${d.pickup_at ? ' · afhentning ' + t(d.pickup_at) : ''}</p>
      ${d.status === 'cancelled' ? '<p>Bestillingen er annulleret.</p>' : `<ul class="steps">${STEPS.map((s, i) => `<li class="${i <= reached ? 'on' : ''}"><i></i>${LABEL[s]}${at[s] ? ` <span class="muted">· ${t(at[s])}</span>` : ''}</li>`).join('')}</ul>`}
      ${d.driver_first_name ? `<p class="muted">Din chauffør: ${esc(d.driver_first_name)}</p>` : ''}
      ${d.delivered ? `<p>Modtaget af <b>${esc(d.recipient_name || '–')}</b>${d.has_pod_photo ? ' · leveringsfoto er gemt' : ''}</p>` : ''}`;
    const mc = document.getElementById('mapcard');
    if (d.position) {
      mc.hidden = false;
      if (!map) { map = L.map('map').setView([d.position.lat, d.position.lon], 12); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map); marker = L.marker([d.position.lat, d.position.lon]).addTo(map); }
      else { marker.setLatLng([d.position.lat, d.position.lon]); map.panTo([d.position.lat, d.position.lon]); }
      document.getElementById('mapnote').textContent = `Placering opdateret ${t(d.position.updated_at)}`;
    } else { mc.hidden = true; }
    if (['delivered', 'cancelled'].includes(d.status)) stop();
  }
  const stop = () => clearInterval(timer);
  load(); timer = setInterval(load, 20000);
})();
</script>
</body>
</html>
