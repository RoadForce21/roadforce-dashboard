<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ny adgangskode – Road Force</title>
<style>
:root{--bg:#0b0d10;--card:#14171c;--card2:#1b2027;--line:#262b34;--text:#f5f5f2;--muted:#8c94a3;--blue:#255cff;--green:#2fcf7a;--red:#ff5d5d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:460px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px}
h1{margin:0;font-size:22px}label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
input{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}
button{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5}
.muted{color:var(--muted);font-size:14px}.err{color:var(--red)}.ok{color:var(--green)}
</style>
</head>
<body>
<main>
  <div class="card" id="c">
    <h1>Vælg ny adgangskode</h1>
    <p class="muted" id="m">Kontrollerer linket…</p>
    <form id="f" hidden>
      <label>Ny adgangskode (mindst 8 tegn)<input name="p1" type="password" minlength="8" required autocomplete="new-password"></label>
      <label>Gentag adgangskode<input name="p2" type="password" minlength="8" required autocomplete="new-password"></label>
      <button>Gem ny adgangskode</button>
    </form>
    <div id="r"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const sb = supabase.createClient(window.RF_CONFIG.SUPABASE_URL, window.RF_CONFIG.SUPABASE_ANON_KEY, { auth: { detectSessionInUrl: true, persistSession: false, autoRefreshToken: false } });
let ready = false;
sb.auth.onAuthStateChange((event) => { if (event === 'PASSWORD_RECOVERY') show(); });
function show() { ready = true; $('#m').textContent = 'Skriv din nye adgangskode.'; $('#f').hidden = false; }
setTimeout(() => { if (!ready) { $('#m').textContent = ''; $('#r').innerHTML = '<p class="err">Linket er ugyldigt eller udløbet. Gå tilbage til appen, og tryk på "Glemt adgangskode?" for at få et nyt.</p>'; } }, 4000);
$('#f').onsubmit = async (ev) => {
  ev.preventDefault(); const f = ev.target; $('#r').textContent = '';
  if (f.p1.value !== f.p2.value) return ($('#r').innerHTML = '<p class="err">De to adgangskoder er ikke ens.</p>');
  f.querySelector('button').disabled = true;
  const { error } = await sb.auth.updateUser({ password: f.p1.value });
  if (error) { f.querySelector('button').disabled = false; return ($('#r').innerHTML = '<p class="err">' + (/same|different/i.test(error.message) ? 'Vælg en anden adgangskode end den gamle.' : /weak|short|least/i.test(error.message) ? 'Adgangskoden er for svag. Brug mindst 8 tegn.' : 'Adgangskoden kunne ikke ændres. Bed om et nyt link og prøv igen.') + '</p>'); }
  f.hidden = true; $('#m').textContent = ''; $('#r').innerHTML = '<p class="ok"><b>Adgangskoden er ændret.</b> Åbn Road Force eller RF Partner, og log ind med den nye adgangskode.</p>';
  await sb.auth.signOut();
};
</script>
</body>
</html>
